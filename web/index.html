<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DAW engine test bench</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1e2128;
    --line: #2e323c;
    --text: #e6e8ec;
    --muted: #9aa1ad;
    --accent: #6ea8fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }

  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 14px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }

  .readouts { display: flex; gap: 20px; align-items: center; margin-left: auto; font-size: 13px; }
  .readouts span { color: var(--muted); }
  .readouts b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  .peak { width: 90px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  #peak-fill { height: 100%; width: 0%; background: var(--accent); transition: width 60ms linear; }
  #peak-fill.clipping { background: #e5534b; }

  /* Keys are laid out in a row; black keys overlay the gap between whites. */
  #keyboard {
    position: relative; display: flex; height: 150px; margin-bottom: 24px;
    user-select: none; touch-action: none;
  }
  .key { border-radius: 0 0 4px 4px; cursor: pointer; }
  .key.white {
    flex: 1; background: #f2f3f5; border: 1px solid #babec7; border-top: none;
  }
  .key.white.held { background: var(--accent); }
  .key.black {
    width: 0; height: 62%; background: #23262e; border: 1px solid #0c0e12; border-top: none;
    margin: 0 -1.6% 0 -1.6%; flex: 0 0 3.2%; z-index: 2; position: relative;
  }
  .key.black.held { background: var(--accent); }

  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 14px 16px 16px; }
  legend { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; padding: 0 6px; }
  label { display: block; margin-top: 12px; font-size: 13px; color: var(--muted); }
  label:first-of-type { margin-top: 0; }
  .row { display: flex; justify-content: space-between; }
  .row b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; margin-top: 4px; accent-color: var(--accent); }
  select {
    width: 100%; margin-top: 4px; padding: 5px; background: var(--bg);
    color: var(--text); border: 1px solid var(--line); border-radius: 5px; font: inherit;
  }
  .hint { color: var(--muted); font-size: 12px; margin-top: 20px; }
  code { background: var(--panel); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <h1>DAW engine test bench</h1>
  <p class="sub">Phase 1: 8-voice polyphony, ADSR, resonant filter. Click keys, use your computer keyboard, or plug in MIDI.</p>

  <div class="bar">
    <button id="start">Start audio</button>
    <button id="stop">Stop</button>
    <button id="panic">All notes off</button>
    <div class="readouts">
      <div><span>status</span> <b id="status">stopped</b></div>
      <div><span>voices</span> <b id="voices">0 / 8</b></div>
      <div class="peak" title="peak level"><div id="peak-fill"></div></div>
    </div>
  </div>

  <div id="keyboard"></div>

  <div class="panels">
    <fieldset>
      <legend>Envelope</legend>
      <label class="row"><span>Attack</span><b id="attack-value">5</b></label>
      <input id="attack" data-param="setAttack" type="range" min="0" max="2000" value="5" step="1" />

      <label class="row"><span>Decay</span><b id="decay-value">120</b></label>
      <input id="decay" data-param="setDecay" type="range" min="1" max="3000" value="120" step="1" />

      <label class="row"><span>Sustain</span><b id="sustain-value">0.7</b></label>
      <input id="sustain" data-param="setSustain" type="range" min="0" max="1" value="0.7" step="0.01" />

      <label class="row"><span>Release</span><b id="release-value">250</b></label>
      <input id="release" data-param="setRelease" type="range" min="1" max="4000" value="250" step="1" />
    </fieldset>

    <fieldset>
      <legend>Filter</legend>
      <label>Type</label>
      <select id="filter-type" data-param="setFilterType">
        <option value="0">Low pass</option>
        <option value="1">High pass</option>
        <option value="2">Band pass</option>
      </select>

      <label class="row"><span>Cutoff (Hz)</span><b id="cutoff-value">4000</b></label>
      <input id="cutoff" data-param="setFilterCutoff" type="range" min="40" max="18000" value="4000" step="10" />

      <label class="row"><span>Resonance</span><b id="resonance-value">0.9</b></label>
      <input id="resonance" data-param="setFilterResonance" type="range" min="0.1" max="12" value="0.9" step="0.1" />
    </fieldset>

    <fieldset>
      <legend>Tone</legend>
      <label>Waveform</label>
      <select id="waveform" data-param="setWaveform">
        <option value="1">Saw</option>
        <option value="0">Sine</option>
        <option value="2">Square</option>
      </select>

      <label class="row"><span>Master gain</span><b id="gain-value">0.25</b></label>
      <input id="gain" data-param="setMasterGain" type="range" min="0" max="1" value="0.25" step="0.01" />
    </fieldset>
  </div>

  <p class="hint">
    Computer keyboard: <code>A</code>–<code>;</code> for white keys, <code>W E T Y U O P</code> for black.
    MIDI input: <b id="midi-status">checking…</b>
  </p>
</main>

<script src="main.js"></script>
</body>
</html>
